# Cava config for the Now Playing bar visualizer (read by BarWidget.qml).
# Outputs one line per frame: 16 bar heights (0-100) separated by ";".

[general]
bars = 16
framerate = 30
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
